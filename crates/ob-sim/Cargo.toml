[package]
name = "ob-sim"
version.workspace = true
edition.workspace = true
description = "Overbright's simulation layer: the physics, the AI, the race and the scenes' per-tick rules."
license.workspace = true
publish = false
build = "build.rs"
# Hands its build id to the crates above it (build_support/build_id.rs).
links = "ob_sim"

# What advances the world each tick (`drive`, `ai`, `contact`, `smackable`, `weather`, the opponents, the camera
# and shop scenes, the effect controller, the audio cues' data). On the layers below it only (ob-core, ob-formats,
# ob-map, ob-settings, ob-assets); no window or audio crate, checked by scripts/checks/crate_layers.sh.
[dependencies]
ob-core = { path = "../ob-core" }
ob-formats = { path = "../ob-formats" }
ob-map = { path = "../ob-map" }
ob-settings = { path = "../ob-settings" }
ob-assets = { path = "../ob-assets" }
anyhow.workspace = true
bytemuck.workspace = true
env_logger.workspace = true
gilrs = "0.11"
glam.workspace = true
log.workspace = true
profiling.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true
wgpu.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The force-feedback output's DirectInput 8 path (`pad::ff_out`), Microsoft's `windows` bindings, MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# The test kit (crates/ob-testkit, docs/developing/testing.md).
ob-testkit = { path = "../ob-testkit" }

[features]
# The developer harness's hooks (the root package's `dev-harness` turns it on).
dev-harness = ["ob-core/dev-harness", "ob-formats/dev-harness", "ob-map/dev-harness", "ob-settings/dev-harness", "ob-assets/dev-harness"]
