[package]
name = "ob-render"
version.workspace = true
edition.workspace = true
description = "Overbright's render layer: the GPU renderer, the native and enhanced passes, the shaders and the sky."
license.workspace = true
publish = false
build = "build.rs"
# Hands its build id to the crates above it (build_support/build_id.rs).
links = "ob_render"

# The renderer (`render`, with its WGSL shaders), the sky and the rear-view mirror, the GPU timing scopes and the
# monitor facts. On the layers below it only (ob-core, ob-formats, ob-settings, ob-assets, ob-sim); no audio crate,
# checked by scripts/checks/crate_layers.sh.
[dependencies]
ob-core = { path = "../ob-core" }
ob-formats = { path = "../ob-formats" }
ob-settings = { path = "../ob-settings" }
ob-assets = { path = "../ob-assets" }
ob-sim = { path = "../ob-sim" }
anyhow.workspace = true
bytemuck.workspace = true
glam.workspace = true
image.workspace = true
log.workspace = true
pollster.workspace = true
profiling.workspace = true
rayon.workspace = true
wgpu.workspace = true
winit.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# The test kit (crates/ob-testkit, docs/developing/testing.md).
ob-testkit = { path = "../ob-testkit" }

[features]
# The developer harness's hooks (the root package's `dev-harness` turns it on).
dev-harness = ["ob-core/dev-harness", "ob-formats/dev-harness", "ob-settings/dev-harness", "ob-assets/dev-harness", "ob-sim/dev-harness"]
