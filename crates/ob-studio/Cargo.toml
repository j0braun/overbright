[package]
name = "ob-studio"
version.workspace = true
edition.workspace = true
description = "Overbright Studio without a window: the kinds, fields and commands, sessions and merges."
license.workspace = true
publish = false
# The test kit's switches (`ob_game`, `ob_private`) for the tests on the player's game files.
build = "build.rs"

# Studio's operation layer (no window, no egui): what the window crate (crates/ob-studio-gui), the command-line tool
# and the MCP adapter share. It names the game library only through `nfsu2::studio_api` and reaches the lower
# layers through their own crates (scripts/checks/crate_layers.sh).
[dependencies]
nfsu2 = { path = "../..", default-features = false }
ob-asset-format = { path = "../ob-asset-format" }
# The atomic file write (temporary file, flush, rename) the history's files go through.
ob-core = { path = "../ob-core" }
ob-formats = { path = "../ob-formats" }
ob-map = { path = "../ob-map" }
glam.workspace = true
toml.workspace = true
# The history's journal records and the inbox's requests (JSON), checked by a hash per record.
serde.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true
# Looks: the work files and the pack data (PNG).
image.workspace = true

[dev-dependencies]
# The test kit (crates/ob-testkit, docs/developing/testing.md).
ob-testkit = { path = "../ob-testkit" }

[features]
# The game library's developer harness, as the root package names it.
dev-harness = ["nfsu2/dev-harness"]
