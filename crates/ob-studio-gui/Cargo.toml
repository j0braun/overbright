[package]
name = "ob-studio-gui"
version.workspace = true
edition.workspace = true
description = "Overbright Studio's window crate: the desktop map editor (overbright-editor) and Studio's window (overbright-studio, a preview)."
license.workspace = true
publish = false
build = "build.rs"

# The map editor (src/editor/, the `overbright-editor` program,
# docs/modding/map-editor.md): a leaf on the game library. The game's own packages
# never depend on it, so egui is not in the game's dependency tree.
[dependencies]
# The game library, named only through its interface for Studio (`nfsu2::studio_api`), and its lower layers.
nfsu2 = { path = "../..", default-features = false }
ob-core = { path = "../ob-core" }
ob-formats = { path = "../ob-formats" }
ob-map = { path = "../ob-map" }
# Studio without a window: the map session (one mod open on one region, its undo history).
ob-studio = { path = "../ob-studio" }
# The look shared with the launcher (colour tokens, type, lamps, legends).
ob-look = { path = "../ob-look" }
anyhow.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
image.workspace = true
log.workspace = true
env_logger.workspace = true
toml.workspace = true
# Pads in Studio's window (the version the game uses).
gilrs = "0.11"
# The editor's UI: egui with its winit input and wgpu renderer, on the
# wgpu / winit versions above. Pinned exactly: egui changes its API between
# minor versions. MIT OR Apache-2.0. Without egui's default fonts (not all
# GPL-compatible) and without the system clipboard (its Windows crate ships
# no licence text); winit itself brings the X11 and Wayland backends.
egui = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }

[dev-dependencies]
# The test kit (crates/ob-testkit, docs/developing/testing.md).
ob-testkit = { path = "../ob-testkit" }
# The font test reads the faces' glyph tables (already in the tree through
# the launcher's text, Apache-2.0).
ab_glyph.workspace = true

[features]
# The game library's allocator choice and developer harness, as the root
# package names them (a build of the workspace with `--features dev-harness`
# turns it on here too).
default = ["mimalloc"]
mimalloc = ["nfsu2/mimalloc"]
dev-harness = ["nfsu2/dev-harness", "ob-studio/dev-harness"]

[[bin]]
name = "overbright-editor"
path = "src/bin/overbright-editor.rs"

[[bin]]
name = "overbright-studio"
path = "src/bin/overbright-studio.rs"
