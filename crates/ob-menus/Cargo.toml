[package]
name = "ob-menus"
version.workspace = true
edition.workspace = true
description = "Overbright's menus layer: the front end from the game's FEng packages, the career and the performance overlay."
license.workspace = true
publish = false
build = "build.rs"
# Hands its build id to the crates above it (build_support/build_id.rs).
links = "ob_menus"

# The menus (`frontend`: screens, widgets, the HUD, the career, the options) and the performance overlay. On the
# layers below it only (ob-core, ob-formats, ob-map, ob-settings, ob-assets, ob-sim, ob-audio, ob-render); no
# window or audio crate of its own, checked by scripts/checks/crate_layers.sh.
[dependencies]
ob-core = { path = "../ob-core" }
ob-formats = { path = "../ob-formats" }
ob-map = { path = "../ob-map" }
ob-settings = { path = "../ob-settings" }
ob-assets = { path = "../ob-assets" }
ob-sim = { path = "../ob-sim" }
ob-audio = { path = "../ob-audio" }
ob-render = { path = "../ob-render" }
anyhow.workspace = true
glam.workspace = true
log.workspace = true
wgpu.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The test kit (crates/ob-testkit, docs/developing/testing.md).
ob-testkit = { path = "../ob-testkit" }
# The lower crates' test helpers (their `dev-harness` hooks), on for this crate's own test build only.
ob-core = { path = "../ob-core", features = ["dev-harness"] }
ob-formats = { path = "../ob-formats", features = ["dev-harness"] }
ob-map = { path = "../ob-map", features = ["dev-harness"] }
ob-settings = { path = "../ob-settings", features = ["dev-harness"] }
ob-assets = { path = "../ob-assets", features = ["dev-harness"] }
ob-sim = { path = "../ob-sim", features = ["dev-harness"] }
ob-audio = { path = "../ob-audio", features = ["dev-harness"] }
ob-render = { path = "../ob-render", features = ["dev-harness"] }

[features]
# The developer harness's hooks (the root package's `dev-harness` turns it on).
dev-harness = ["ob-core/dev-harness", "ob-formats/dev-harness", "ob-settings/dev-harness", "ob-assets/dev-harness", "ob-sim/dev-harness", "ob-audio/dev-harness", "ob-render/dev-harness", "ob-map/dev-harness"]
