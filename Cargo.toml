[package]
name = "nfsu2"
version.workspace = true
edition.workspace = true
description = "Reimplementation of Need for Speed: Underground 2 (2004) in Rust and wgpu."
license.workspace = true

# The workspace (ARCHITECTURE.md): this package (the library, the game, the launcher, the tools),
# the library's lower layers (crates/ob-core, crates/ob-formats; ARCHITECTURE.md "Layers"), the asset
# format's core (crates/ob-asset-format: docs/modding/asset-format/), the map data (crates/ob-map), the shared look (crates/ob-look), Studio without a window (crates/ob-studio), the map editor (crates/ob-studio-gui, a leaf on the
# library) and the test kit (crates/ob-testkit, dev only).
# Dependencies point down only: nothing here depends on the editor. The default members are this
# package, the library's layers and the editor, so `cargo build --release --bins` makes all three
# player programs and `cargo test` runs every layer's tests. The developer probes (devprobes/, the
# maintainer's private probes) are a member but not a default one: a plain `cargo build`/`cargo test`
# here builds only the game, the editor, their tools and the public examples; `cargo check --release
# -p devprobes` (scripts/checks/devprobes.sh) keeps the probes compiling.
[workspace]
members = [".", "crates/ob-core", "crates/ob-formats", "crates/ob-asset-format", "crates/ob-map", "crates/ob-look", "crates/ob-studio", "crates/ob-studio-gui", "crates/ob-testkit"]
exclude = ["fuzz"]
default-members = [".", "crates/ob-core", "crates/ob-formats", "crates/ob-asset-format", "crates/ob-map", "crates/ob-look", "crates/ob-studio", "crates/ob-studio-gui"]

# The versions every package of the workspace takes (`dep.workspace = true` in its manifest), so the
# library's crates, the game and the leaf crates build against one copy of each.
[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.32", features = ["bytemuck"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
rayon = "1"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
profiling = "1"
sha2 = "0.10"
miniz_oxide = "0.8"
lzma-rs = { version = "0.3", default-features = false }
block_compression = { version = "0.11.0", default-features = false, features = ["bc7", "bc15"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
semver = "1.0.28"
serde_json = { version = "1.0.137", features = ["float_roundtrip"] }
libc = "0.2"
ab_glyph = "0.2.32"
proptest = { version = "1", default-features = false, features = ["std"] }

# One version for every package of the workspace (the release's).
[workspace.package]
version = "0.5.3"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# The library's lower layers (ARCHITECTURE.md "Layers"), re-exported at the old paths.
ob-core = { path = "crates/ob-core" }
ob-formats = { path = "crates/ob-formats" }
# The map data (crates/ob-map: map mod files, edit operations, races, the simulation record), re-exported at
# its old paths under `tools::map`.
ob-map = { path = "crates/ob-map" }
# The look shared by the launcher, the map editor and Studio (crates/ob-look), re-exported at `launch::theme`.
ob-look = { path = "crates/ob-look" }
# The asset format: the importer the launcher's Game data screen runs (src/launcher/game_data.rs), and the run
# file check (`ob.run`) on the simulation's stream (src/bin/game/enh/sim_stream.rs).
ob-asset-format = { path = "crates/ob-asset-format" }
anyhow.workspace = true
bytemuck.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
image.workspace = true
log.workspace = true
env_logger.workspace = true
# 0.18: its ALSA worker recovers from POLLERR (0.17.3 spun on it for good
# after one xrun: the "no in-game sound" of 2026-11-01). On Linux the
# PulseAudio host (a pure-Rust client; PipeWire's pulse server too) is
# tried first, ALSA after it (`audio::mixer`).
cpal = "0.18"
rayon.workspace = true
memmap2.workspace = true
xxhash-rust.workspace = true
# CPU profiling scopes (no-ops unless a `profile-*` feature is on).
profiling.workspace = true
# The game's allocator (`allocator.rs`): mimalloc by default, the lean or
# the system allocator on small machines; `--no-default-features` builds
# with the system allocator only.
mimalloc = { version = "0.1", optional = true, default-features = false }
# Gamepads and joysticks (the DirectInput 8 path of the original, `pad`).
gilrs = "0.11"
# SHA-256 of the game's key files (`fingerprint`: --check-game, crash
# reports). RustCrypto, MIT OR Apache-2.0.
sha2.workspace = true
# Inflate for TexMod .tpf packages (`formats::tpf`, examples/import_tpf).
# Already in the tree via png; MIT OR Zlib OR Apache-2.0.
miniz_oxide.workspace = true
# LZMA for ZIP archives that use it (`formats::zip`: the HUD mod's map
# download). Pure Rust, MIT.
lzma-rs.workspace = true
# Overbright texture packs (`obpack`, docs/modding/texture-packs.md): BC7 encode and
# decode on the CPU (a port of Intel's ISPC texture compressor kernels; the
# wgpu compute path is not built). MIT.
block_compression.workspace = true
# The packs' manifest, `pack.toml`. MIT OR Apache-2.0.
toml.workspace = true
serde.workspace = true
# Map edits as JSON (`tools::map::ops`: the editor's operations, read and
# written by the map tools). MIT OR Apache-2.0.
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# The allocator's memory probe (/proc/meminfo, sysctl) before main.
libc.workspace = true

[dev-dependencies]
# Property-based fuzzing of the file readers (tests/fuzz_readers.rs).
# MIT OR Apache-2.0.
proptest.workspace = true
# The test kit (crates/ob-testkit, docs/developing/testing.md).
ob-testkit = { path = "crates/ob-testkit" }

[features]
# Tracy: `cargo build --release --features profile-tracy`, then connect the
# Tracy profiler (wgpu-core's and wgpu-hal's own scopes come too).
profile-tracy = ["profiling/profile-with-tracy"]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
# The developer harness (`--shot`, `--selftest`, flows, benches, parity,
# playthrough, audio capture …, src/bin/game/dev/): not part of the shipped
# game, off by default. Without it the dev hooks in the game's paths are
# no-ops (src/bin/game/dev_hooks.rs) and the dev flags end in the usage
# error. The checks, the gate, perf.sh and pgo.sh build with it:
# `cargo build --release --features dev-harness`; the game's tests need it
# too (`cargo test --release --features dev-harness`).
dev-harness = ["ob-core/dev-harness", "ob-formats/dev-harness", "ob-map/dev-harness", "ob-look/dev-harness"]

# Integration tests that use the developer harness's library aids
# (`frontend::drawn_texts`): built only with `dev-harness`.
[[test]]
name = "photo_challenge_hud"
required-features = ["dev-harness"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Cross-crate inlining (wgpu-core's hot paths) for the shipped build; Rust
# does no fast-math, so no result changes. PGO on top: see README,
# "Performance".
[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
# The launcher's system folder dialog (docs/launcher.md "Choosing the game
# folder"): the desktop's file chooser through the XDG portal (libdbus is
# opened at run time), else zenity. MIT.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }


# The launcher (`overbright`, src/launcher/, docs/launcher.md): a CPU-drawn
# window (no GPU needed, so it can report a broken driver). softbuffer: the
# window's pixel buffer, MIT OR Apache-2.0 (no KMS backend). tiny-skia
# (BSD-3-Clause) and ab_glyph (Apache-2.0) were already in the tree through
# winit's sctk-adwaita; the font is Go (BSD-3-Clause, crates/ob-look/fonts/).
[[bin]]
name = "overbright"
path = "src/bin/overbright.rs"

[dependencies.softbuffer]
version = "0.4.8"
default-features = false
features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"]

[dependencies.tiny-skia]
version = "0.11.4"
default-features = false
features = ["std", "simd"]

[dependencies.ab_glyph]
workspace = true

# The launcher's "Shift held at start" check on X11 / XWayland
# (XQueryKeymap; libX11 loaded at run time): x11-dl 2.21, MIT, already in
# the tree through winit (no new crate).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.x11-dl]
version = "2.21"

# Development and pre-merge builds (docs/developing/build-times.md): the release
# settings without LTO, 16 codegen units, incremental. Same results (no
# fast-math), ~2.7x faster cold, ~20 s after a one-file change instead of
# minutes. Never for releases, perf numbers or PGO: those use `--release`.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
