[package]
name = "nfsu2-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace: cargo-fuzz builds it with nightly and sanitizer flags.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
glam = "0.32"

[dependencies.nfsu2]
path = ".."

